# Yeni sürüm: "v0.2.0" gibi bir etiket gönderince Windows, macOS (Apple Silicon + Intel) ve
# Linux kurulum dosyalarını derleyip GitHub Releases'e yükler. Kurulu uygulamalar oradan
# kendiliğinden güncellenir.
#
# Gerekli depo değişkeni (Settings → Secrets and variables → Actions → Variables):
#   SIGNAL_URL  = https://birlikte-izle-signal.<hesabın>.workers.dev
name: Sürüm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            hedef: --win
          - os: macos-latest # Apple Silicon (arm64)
            hedef: --mac --arm64
          # Intel Mac (x64): Apple Silicon makinesinde çapraz derlenir. Intel macOS 15 makinesinde
          # dmg aracı (dmgbuild/mac_alias) "'I' format requires 0 <= number <= 4294967295" ile çöküyor.
          - os: macos-latest
            hedef: --mac --x64
            ffmpeg_arch: x64
          - os: ubuntu-latest
            hedef: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ffmpeg-static ve Electron, çalıştığı makinenin platformuna uygun dosyayı indirir.
      - run: npm ci

      # ffmpeg-static makinenin mimarisini indirir; çapraz derlemede hedef mimariyi indir ve doğrula.
      - name: Hedef mimari için ffmpeg
        if: matrix.ffmpeg_arch
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=${{ matrix.ffmpeg_arch }} node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg | tee /dev/stderr | grep -q x86_64

      - name: Uygulamayı derle
        run: npm run build -w @birlikte/desktop
        env:
          VITE_SIGNAL_URL: ${{ vars.SIGNAL_URL }}

      - name: Kurulum dosyasını üret ve yayınla
        working-directory: apps/desktop
        shell: bash
        run: |
          # İsteğe bağlı Apple Developer sertifikası. Yoksa değişken hiç tanımlanmamalı: boş değeri
          # electron-builder dosya yolu sanıp "not a file" hatası veriyor. (Yoksa ad-hoc imzalanır.)
          if [ -n "$MAC_CSC_LINK" ]; then export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"; fi
          npx electron-builder --config electron-builder.config.cjs ${{ matrix.hedef }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIRLIKTE_GH_OWNER: ${{ github.repository_owner }}
          BIRLIKTE_GH_REPO: ${{ github.event.repository.name }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
